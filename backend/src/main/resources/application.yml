server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: lease-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LEASE_DB_URL:jdbc:mysql://localhost:3306/lease_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${LEASE_DB_USERNAME:root}
    password: ${LEASE_DB_PASSWORD:root}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${LEASE_REDIS_HOST:localhost}
      port: ${LEASE_REDIS_PORT:6379}
      database: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:campus-lease-secret-key-2024-very-long-secret-key-for-local-dev-only}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@123456}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:系统管理员}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.campus.lease: debug

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
  access:
    path: ${FILE_ACCESS_PATH:/uploads}
  public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:${server.port}}

wechat:
  pay:
    app-id: ${WECHAT_PAY_APP_ID:local-app}
    mch-id: ${WECHAT_PAY_MCH_ID:local-mch}
    mch-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:local-serial}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:local-api-v3-key}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:http://127.0.0.1:${server.port}/api/payment/notify}

