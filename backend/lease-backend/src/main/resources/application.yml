server:
  port: 8081

spring:
  application:
    name: lease-backend

  sql:
    init:
      mode: never

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LEASE_DB_URL:jdbc:mysql://localhost:3306/lease_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${LEASE_DB_USERNAME:root}
    password: ${LEASE_DB_PASSWORD:root}



  data:
    redis:
      host: ${LEASE_REDIS_HOST:localhost}
      port: ${LEASE_REDIS_PORT:6379}
      database: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: campus-lease-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.campus.lease: debug

file:
  upload:
    path: ./uploads
  access:
    path: /uploads

